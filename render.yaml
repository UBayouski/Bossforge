services:
  - type: web
    name: boss-by-chat
    runtime: node
    plan: free
    numInstances: 1
    buildCommand: npm test && npm run check
    startCommand: node server.mjs
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TWITCH_CLIENT_ID
        sync: false
